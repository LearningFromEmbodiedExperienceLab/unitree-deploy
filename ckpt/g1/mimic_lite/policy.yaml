#
# MimicLite v1.1: command[304], policy[535] -> action[29].
# Converted from the supplied deployment YAML; numeric joint arrays use SDK order.
# obs/action joint orders preserve the source training order. Normalization is inside ONNX.
#

robot: "g1"
imu_source: "pelvis"
policy_path: "./policy_mimic_lite_v1.1.onnx"
policy_class: unitree_deploy.policy.motion_tracking.motion_tracking_policy:MotionTrackingPolicy
reference_source: external  # reference motion is from external reference motion stream

policy_step_dt: 0.02
physics_dt: 0.001
decimation: 20

# Runtime joystick command dimension; separate from the reference motion command.
runtime_command_dim: 3

# Training obs joint order.
obs_joint_order: [
  "left_hip_pitch_joint", "right_hip_pitch_joint", "waist_yaw_joint", "left_hip_roll_joint", "right_hip_roll_joint",
  "waist_roll_joint", "left_hip_yaw_joint", "right_hip_yaw_joint", "waist_pitch_joint", "left_knee_joint", "right_knee_joint",
  "left_shoulder_pitch_joint", "right_shoulder_pitch_joint", "left_ankle_pitch_joint", "right_ankle_pitch_joint", "left_shoulder_roll_joint",
  "right_shoulder_roll_joint", "left_ankle_roll_joint", "right_ankle_roll_joint", "left_shoulder_yaw_joint", "right_shoulder_yaw_joint",
  "left_elbow_joint", "right_elbow_joint", "left_wrist_roll_joint", "right_wrist_roll_joint", "left_wrist_pitch_joint",
  "right_wrist_pitch_joint", "left_wrist_yaw_joint", "right_wrist_yaw_joint"]

# SDK joint order used by joint positions, action scales, and PD gains below.
sdk_joint_order: [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint", "left_knee_joint", "left_ankle_pitch_joint",
  "left_ankle_roll_joint", "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint", "right_knee_joint",
  "right_ankle_pitch_joint", "right_ankle_roll_joint", "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint", "left_shoulder_pitch_joint",
  "left_shoulder_roll_joint", "left_shoulder_yaw_joint", "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint",
  "left_wrist_yaw_joint", "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint", "right_elbow_joint",
  "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint"]

# Default joint positions in sdk_joint_order.
default_qpos: [-0.31200000643730164, 0.0, 0.0, 0.6690000295639038, -0.3630000054836273, 0.0, -0.31200000643730164,
  0.0, 0.0, 0.6690000295639038, -0.3630000054836273, 0.0, 0.0, 0.0, 0.0, 0.20000000298023224, 0.20000000298023224,
  0.0, 0.6000000238418579, 0.0, 0.0, 0.0, 0.20000000298023224, -0.20000000298023224, 0.0, 0.6000000238418579,
  0.0, 0.0, 0.0]


policy_input_name: policy
policy_output_name: action

# Observation specs.
obs_use_scaled_prev_action: false
obs_prime_on_reset: true
obs_group_concat_mode: term_major
observation_modules: [unitree_deploy.obs.motion_tracking_obs]
observation_types:
  base_ang_vel: unitree_deploy.obs.motion_tracking_obs:SparseAngularVelocityObservation
  projected_gravity: unitree_deploy.obs.motion_tracking_obs:SparseGravityObservation
  joint_pos: unitree_deploy.obs.motion_tracking_obs:SparseJointPositionObservation
  joint_vel: unitree_deploy.obs.motion_tracking_obs:SparseJointVelocityObservation
  prev_action: PreviousActionObservation

# Reference body order in the embedded motion; must match ONNX metadata.
root_body_name: "pelvis"
anchor_body_name: "pelvis"
body_names: ["pelvis"]

# external reference motion stream
reference_motion:
  topic: rt/reference_motion
  timeout: 0.2
  tolerance: 0.04

# Observation order must match the actor input layout.
observations:
- type: motion_reference_window
  history_len: 1
  params:
    field: ref_body_pos_future_local
    future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]
    body_names: [pelvis]
  input: command
- type: motion_reference_window
  history_len: 1
  params:
    field: ref_root_ori_future_b
    future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]
  input: command
- type: motion_reference_window
  history_len: 1
  params:
    field: ref_joint_pos_future
    future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]
    joint_names: ["left_hip_pitch_joint", "right_hip_pitch_joint", "waist_yaw_joint", "left_hip_roll_joint", "right_hip_roll_joint",
      "waist_roll_joint", "left_hip_yaw_joint", "right_hip_yaw_joint", "waist_pitch_joint", "left_knee_joint", "right_knee_joint",
      "left_shoulder_pitch_joint", "right_shoulder_pitch_joint", "left_ankle_pitch_joint", "right_ankle_pitch_joint",
      "left_shoulder_roll_joint", "right_shoulder_roll_joint", "left_ankle_roll_joint", "right_ankle_roll_joint", "left_shoulder_yaw_joint",
      "right_shoulder_yaw_joint", "left_elbow_joint", "right_elbow_joint", "left_wrist_roll_joint", "right_wrist_roll_joint",
      "left_wrist_pitch_joint", "right_wrist_pitch_joint", "left_wrist_yaw_joint", "right_wrist_yaw_joint"]
  input: command
- type: base_ang_vel
  history_len: 1
  params:
    history_steps: [0, 1, 2, 3, 4, 8, 16]
  input: policy
- type: projected_gravity
  history_len: 1
  params:
    history_steps: [0, 1, 2, 3, 4, 8, 16]
  input: policy
- type: joint_pos
  history_len: 1
  params:
    history_steps: [0, 1, 2, 3, 4, 8, 16]
  input: policy
- type: joint_vel
  history_len: 1
  params:
    history_steps: [0, 1, 2, 3, 4, 8, 16]
  input: policy
- type: prev_action
  history_len: 3
  history_order: newest_first
  input: policy


# Action specs. null disables action clipping.
action_dim: 29
action_clip: null

# Action joint order follows training action joint order.
action_joint_order: ["left_hip_pitch_joint", "right_hip_pitch_joint", "waist_yaw_joint", "left_hip_roll_joint", "right_hip_roll_joint",
  "waist_roll_joint", "left_hip_yaw_joint", "right_hip_yaw_joint", "waist_pitch_joint", "left_knee_joint", "right_knee_joint",
  "left_shoulder_pitch_joint", "right_shoulder_pitch_joint", "left_ankle_pitch_joint", "right_ankle_pitch_joint", "left_shoulder_roll_joint",
  "right_shoulder_roll_joint", "left_ankle_roll_joint", "right_ankle_roll_joint", "left_shoulder_yaw_joint", "right_shoulder_yaw_joint",
  "left_elbow_joint", "right_elbow_joint", "left_wrist_roll_joint", "right_wrist_roll_joint", "left_wrist_pitch_joint",
  "right_wrist_pitch_joint", "left_wrist_yaw_joint", "right_wrist_yaw_joint"]

