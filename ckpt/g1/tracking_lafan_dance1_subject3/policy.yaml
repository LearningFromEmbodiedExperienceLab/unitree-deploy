#
# Loco Lab Flat Terrain Tracking Policy
# Vanilla PPO
# Trained with Z RL
#

robot: "g1"
imu_source: "pelvis"  # pelvis: LowState.imu_state; torso: rt/secondary_imu
policy_path: "policy.onnx"
policy_class: unitree_deploy.policy.motion_tracking.motion_tracking_policy:MotionTrackingPolicy
reference_source: embedded  # reference motion is embedded in onnx

policy_step_dt: 0.02
physics_dt: 0.001
decimation: 20

# Runtime joystick command dimension; separate from the reference motion command.
runtime_command_dim: 3

# Training obs joint order.
obs_joint_order: [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint", "left_knee_joint", "left_ankle_pitch_joint", "left_ankle_roll_joint",
  "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint", "right_knee_joint", "right_ankle_pitch_joint", "right_ankle_roll_joint",
  "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint",
  "left_shoulder_pitch_joint", "left_shoulder_roll_joint", "left_shoulder_yaw_joint", "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint", "left_wrist_yaw_joint",
  "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint", "right_elbow_joint", "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint",
]

# SDK joint order used by joint positions, action scales, and PD gains below.
sdk_joint_order: [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint", "left_knee_joint", "left_ankle_pitch_joint", "left_ankle_roll_joint",
  "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint", "right_knee_joint", "right_ankle_pitch_joint", "right_ankle_roll_joint",
  "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint",
  "left_shoulder_pitch_joint", "left_shoulder_roll_joint", "left_shoulder_yaw_joint", "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint", "left_wrist_yaw_joint",
  "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint", "right_elbow_joint", "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint",
]

# Default joint positions in sdk_joint_order.
default_qpos: [
  -0.10000000149011612, 0.0, 0.0, 0.30000001192092896, -0.20000000298023224, 0.0,
  -0.10000000149011612, 0.0, 0.0, 0.30000001192092896, -0.20000000298023224, 0.0,
  0.0, 0.0, 0.0,
  0.20000000298023224, 0.25, 0.0, 0.8999999761581421, 0.0, 0.0, 0.0,
  0.20000000298023224, -0.25, 0.0, 0.8999999761581421, 0.0, 0.0, 0.0,
]

policy_input_name: "obs"
policy_output_name: "actions"

# Observation specs.
obs_use_scaled_prev_action: false
obs_prime_on_reset: true
obs_group_concat_mode: "term_major"
observation_modules: ["unitree_deploy.obs.motion_tracking_obs"]
observation_types:
  base_ang_vel: "unitree_deploy.obs.base_obs:BaseAngularVelocityObservation"
  projected_gravity: "unitree_deploy.obs.base_obs:ProjectedGravityObservation"
  joint_pos_rel: "unitree_deploy.obs.base_obs:JointPositionObservation"
  joint_vel: "unitree_deploy.obs.base_obs:JointVelocityObservation"
  prev_action: "unitree_deploy.obs.base_obs:PreviousActionObservation"

# Reference motion command fields and concatenation order; must match training.
# Dimension is derived automatically (68 for the six fields below).
# Height is world z; velocities and gravity are expressed in the reference pelvis frame.
motion_command_terms: ["joint_pos", "joint_vel", "base_height", "base_lin_vel", "base_ang_vel", "projected_gravity"]

# Reference body order in the embedded motion; must match ONNX metadata.
root_body_name: "pelvis"
anchor_body_name: "pelvis"
body_names: [
  "pelvis",
  "left_hip_roll_link", "left_knee_link", "left_ankle_roll_link",
  "right_hip_roll_link", "right_knee_link", "right_ankle_roll_link",
  "torso_link",
  "left_shoulder_roll_link", "left_elbow_link", "left_wrist_yaw_link",
  "right_shoulder_roll_link", "right_elbow_link", "right_wrist_yaw_link",
]

# Observation order must match the actor input layout.
observations:
  - type: motion_command
    history_len: 1
  - type: base_ang_vel
    history_len: 1
  - type: projected_gravity
    history_len: 1
  - type: joint_pos_rel
    history_len: 1
  - type: joint_vel
    history_len: 1
  - type: prev_action
    history_len: 1

# Action specs. null disables action clipping.
action_dim: 29
action_clip: null
# target_q = reference joint positions + action_scale * action
use_reference_residual: true  # residual action on reference motion joint positions

# Action joint order follows training action joint order.
action_joint_order: [
  "left_hip_pitch_joint", "left_hip_roll_joint", "left_hip_yaw_joint", "left_knee_joint", "left_ankle_pitch_joint", "left_ankle_roll_joint",
  "right_hip_pitch_joint", "right_hip_roll_joint", "right_hip_yaw_joint", "right_knee_joint", "right_ankle_pitch_joint", "right_ankle_roll_joint",
  "waist_yaw_joint", "waist_roll_joint", "waist_pitch_joint",
  "left_shoulder_pitch_joint", "left_shoulder_roll_joint", "left_shoulder_yaw_joint", "left_elbow_joint", "left_wrist_roll_joint", "left_wrist_pitch_joint", "left_wrist_yaw_joint",
  "right_shoulder_pitch_joint", "right_shoulder_roll_joint", "right_shoulder_yaw_joint", "right_elbow_joint", "right_wrist_roll_joint", "right_wrist_pitch_joint", "right_wrist_yaw_joint",
]

# Action scales in sdk_joint_order.
