[project]
name = "unitree-deploy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.6.0",
    "onnxruntime>=1.24.4",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "pynput",
    "tqdm",
]

[project.optional-dependencies]
viewer = [
    "mjviser>=0.0.16",
    "trimesh",
    "viser>=1.1.1",
]

[project.scripts]
unitree-controller = "unitree_deploy.cli.controller:main"
unitree-motion-source = "unitree_deploy.cli.motion_source:main"
unitree-z1-controller = "unitree_deploy.cli.z1_controller:main"
unitree-plugin-template = "unitree_deploy.cli.plugin_template:main"
unitree-trajectory-recorder = "unitree_deploy.cli.trajectory_recorder:main"
unitree-trajectory-replay = "unitree_deploy.cli.trajectory_replay:main"
unitree-sim-bridge = "unitree_deploy.cli.sim_bridge:main"
unitree-visualizer = "unitree_deploy.cli.visualizer:main"
unitree-realsense = "unitree_deploy.cli.realsense:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitree_deploy = ["robot_model/**/*"]

[tool.setuptools.exclude-package-data]
unitree_deploy = ["robot_model/**/__pycache__/*", "robot_model/**/*.pyc"]
